# The prefix contains the scope, because all packages here are devDependencies.
# With `include: scope`, the prefix is "chore(deps-dev)", which commitlint rejects.
# Each ecosystem has one group for all dependencies. Thus each weekly run opens a
# maximum of one version-update PR for each ecosystem.
# Rebases are off, because each force-push runs CI again. The owner updates the
# branch one time before the merge.
version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore(deps)"
    rebase-strategy: "disabled"
    groups:
      npm:
        patterns:
          - "*"
  - package-ecosystem: "pre-commit"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore(deps)"
    rebase-strategy: "disabled"
    groups:
      pre-commit:
        patterns:
          - "*"
  # Each action has a pin to a commit SHA. Dependabot updates the SHA and its
  # version comment.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore(deps)"
    rebase-strategy: "disabled"
    groups:
      github-actions:
        patterns:
          - "*"

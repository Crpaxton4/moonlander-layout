# commitlint rejects the "chore(deps-dev)" prefix of `include: scope`. Rebases are
# off, because each force-push runs CI again.
version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore(deps)"
    rebase-strategy: "disabled"
    groups:
      npm:
        patterns:
          - "*"
  - package-ecosystem: "pre-commit"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore(deps)"
    rebase-strategy: "disabled"
    groups:
      pre-commit:
        patterns:
          - "*"
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore(deps)"
    rebase-strategy: "disabled"
    groups:
      github-actions:
        patterns:
          - "*"

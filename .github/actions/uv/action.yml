name: "uv"
description: >-
  Installs the pinned uv release and checks its version. uv downloads from PyPI faster
  than the Actions cache restores, so uv has no cache

runs:
  using: composite
  steps:
    - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
      with:
        version: ${{ env.UV_VERSION }}
        enable-cache: false
    - name: "Check uv"
      shell: bash
      run: .github/scripts/shared/check-uv-version.sh

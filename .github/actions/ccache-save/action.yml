name: "Save ccache"
description: >-
  Keeps only the ccache objects of this build, then saves them on a push to main. A PR
  run never saves, because its next push changes the same files again

inputs:
  key:
    description: "Key output of ccache-restore"
    required: true

runs:
  using: composite
  steps:
    - name: "Prune ccache"
      id: prune
      shell: bash
      run: .github/scripts/shared/prune-ccache.sh
    - name: "Save ccache"
      if: ${{ steps.prune.outputs.save == 'true' }}
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ runner.temp }}/ccache
        key: ${{ inputs.key }}

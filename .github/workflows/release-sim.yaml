name: "Release simulation"

on:
  pull_request:

jobs:
  build:
    uses: ./.github/workflows/build.yaml
    with:
      skip-analysis: true

  publish:
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: firmware

      - run: sha256sum ./*.bin

name: "Release Please"

# Events from GITHUB_TOKEN start no workflows, so the job uses a GitHub App token
# for the release PR
on:
  push:
    branches:
      - main

jobs:
  release-please:
    # Same Ubuntu release as the development machine
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      release_created: ${{ steps.release.outputs['src/qmk--release_created'] }}
      tag_name: ${{ steps.release.outputs['src/qmk--tag_name'] }}
    steps:
      # Job reads only the step scripts
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: .github/scripts
          persist-credentials: false

      - uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        id: app-token
        with:
          client-id: ${{ secrets.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}

      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: release
        with:
          token: ${{ steps.app-token.outputs.token }}

      - name: "Auto-merge release PR"
        if: ${{ steps.release.outputs.pr }}
        # GitHub evaluates step env also when the if is false, so fromJSON of an empty
        # output fails. The script reads the PR number from the raw JSON
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          RELEASE_PR: ${{ steps.release.outputs.pr }}
        run: .github/scripts/release-please/auto-merge-release-pr.sh

  build:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    uses: ./.github/workflows/build.yaml
    with:
      firmware-only: true
      release-tag: ${{ needs.release-please.outputs.tag_name }}

  publish:
    needs: [release-please, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      # Job reads only the step scripts. Root files of the sparse checkout
      # contain no .bin file
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: .github/scripts
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: firmware

      - env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.release-please.outputs.tag_name }}
        run: .github/scripts/release-please/upload-release-firmware.sh

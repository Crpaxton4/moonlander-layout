name: "Release Please"

# Events from GITHUB_TOKEN start no workflows, so the job uses a GitHub App token
# for the release PR
on:
  push:
    branches:
      - main

jobs:
  release-please:
    # Same Ubuntu release as the development machine
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      release_created: ${{ steps.release.outputs['src/qmk--release_created'] }}
      tag_name: ${{ steps.release.outputs['src/qmk--tag_name'] }}
    steps:
      # Job reads only the step scripts
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: .github/scripts
          persist-credentials: false

      - uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        id: app-token
        with:
          client-id: ${{ secrets.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}

      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: release
        with:
          token: ${{ steps.app-token.outputs.token }}

      - name: "Auto-merge release PR"
        if: ${{ steps.release.outputs.pr }}
        # GitHub evaluates step env also when the if is false, so fromJSON of an empty
        # output fails. The script reads the PR number from the raw JSON
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          RELEASE_PR: ${{ steps.release.outputs.pr }}
        run: .github/scripts/release-please/auto-merge-release-pr.sh

  # A failed host program, test or check must not stop a release, so this job builds
  # only the firmware, with no debug firmware and no ccache
  build:
    name: "Build release firmware"
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    # Dependabot updates each SHA pin and its release comment on the same line
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: "Load versions"
        run: .github/scripts/shared/load-versions.sh

      - uses: ./.github/actions/zsa-firmware
      - uses: ./.github/actions/qmk-toolchain
      - uses: ./.github/actions/uv
      - name: "Install QMK CLI"
        run: .github/scripts/build/install-qmk-cli.sh
      - run: .github/scripts/build/configure-qmk-cli.sh

      # Firmware build uses CMake. The CI jobs restore the same packages
      - uses: ./.github/actions/apt-packages
        with:
          name: unit-test
          packages: cmake=${{ env.CMAKE_VERSION }} libcmocka-dev=${{ env.CMOCKA_VERSION }}
      - name: "Use pinned CMake"
        run: .github/scripts/shared/use-pinned-cmake.sh

      # Firmware file name ends in the release tag
      - name: "Build firmware"
        env:
          FIRMWARE_ONLY: true
          PR_NUMBER: ""
          PR_HEAD_SHA: ""
          RELEASE_TAG: ${{ needs.release-please.outputs.tag_name }}
        run: .github/scripts/build/build.sh

      # upload-artifact skips the dot directory .build/ without include-hidden-files
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: firmware
          path: .build/*.bin
          if-no-files-found: error
          include-hidden-files: true

  publish:
    needs: [release-please, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      # Job reads only the step scripts. Root files of the sparse checkout
      # contain no .bin file
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: .github/scripts
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: firmware

      - env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.release-please.outputs.tag_name }}
        run: .github/scripts/release-please/upload-release-firmware.sh

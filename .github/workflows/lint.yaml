name: "Lint"

on:
  pull_request:
  workflow_dispatch:

env:
  # Must match PRE_COMMIT_VERSION in setup.sh
  PRE_COMMIT_VERSION: "4.7.0"
  # Must match SHELLCHECK_VERSION in setup.sh
  SHELLCHECK_VERSION: "0.9.0-1"
  # Must match TREE_SITTER_VERSION and TREE_SITTER_C_VERSION in setup.sh
  TREE_SITTER_VERSION: "0.20.8-2"
  TREE_SITTER_C_VERSION: "0.20.5-2"
  # Hook ids or aliases, comma-separated. These hooks report their findings but
  # don't fail the job.
  REPORT_ONLY_HOOKS: "editorconfig-checker-markdown,prettier-markdown"
  # The files release-please changes. Every hook excludes them, so a PR that
  # changes only these files gets the same result as main and skips the lint
  # job; a skipped job still satisfies its required check, which a `paths:`
  # trigger filter would leave pending forever.
  RELEASE_ONLY_PATHS: '^(CHANGELOG\.md|\.release-please-manifest\.json)$'

jobs:
  changes:
    if: github.event_name == 'pull_request'
    # Pinned to the development machine's Ubuntu release so CI tools match local ones.
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: read
    outputs:
      release-only: ${{ steps.diff.outputs.release-only }}
    steps:
      # `true` only when the PR changes at least one file and every changed
      # file is in RELEASE_ONLY_PATHS
      - id: diff
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          files=$(gh pr diff ${{ github.event.pull_request.number }} --repo "$GITHUB_REPOSITORY" --name-only)
          echo "$files"
          if [ -n "$files" ] && ! grep -qvE "$RELEASE_ONLY_PATHS" <<< "$files"; then
            echo "release-only=true" >> "$GITHUB_OUTPUT"
          else
            echo "release-only=false" >> "$GITHUB_OUTPUT"
          fi

  lint:
    name: "Lint"
    needs: changes
    # Skips only when the gate says `true`: a failed gate has no output, so
    # the job runs.
    if: ${{ !cancelled() && (github.event_name != 'pull_request' || needs.changes.outputs.release-only != 'true') }}
    # Same Ubuntu release as the development machine, so apt-pinned tools
    # (shellcheck) have identical versions
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    # Actions are pinned to commit SHAs; the trailing comment names the release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - run: npm ci

      # uv downloads the pre-commit packages from PyPI faster than the Actions
      # cache restores them, so uv's cache is off
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: false
      - name: "Install pre-commit"
        run: uv tool install "pre-commit==$PRE_COMMIT_VERSION"

      # pre-commit's hook environments (Python virtualenvs, and actionlint built
      # with the runner's Go) are cached. Each environment is built from the rev
      # in .pre-commit-config.yaml, so the key holds that file's hash, the
      # pre-commit version and the runner image, whose Python and Go build the
      # environments.
      - name: "Compute pre-commit cache key"
        id: pre-commit-key
        env:
          CONFIG_HASH: ${{ hashFiles('.pre-commit-config.yaml') }}
        run: |
          key="pre-commit-$RUNNER_OS-${ImageOS:?}-${ImageVersion:?}"
          key="$key-$PRE_COMMIT_VERSION-${CONFIG_HASH:?}"
          echo "key=$key" | tee -a "$GITHUB_OUTPUT"
      - name: "Restore pre-commit environments"
        id: pre-commit-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/pre-commit
          key: ${{ steps.pre-commit-key.outputs.key }}

      # Installs the environment of every hook in the config, whatever its
      # stage. On a cache hit, pre-commit checks each restored environment and
      # rebuilds any that doesn't work.
      - name: "Install hook environments"
        run: pre-commit install-hooks

      # Saved before the hooks run, so a hook failure doesn't discard it
      - name: "Save pre-commit environments"
        if: ${{ steps.pre-commit-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/pre-commit
          key: ${{ steps.pre-commit-key.outputs.key }}

      # The runner image ships this version, so no `apt-get update` is needed.
      # apt installs exactly the pinned version or fails.
      - name: "Install shellcheck"
        run: |
          sudo apt-get install -y "shellcheck=$SHELLCHECK_VERSION"
          shellcheck --version

      # The check-standards hook and the checker-test step build against
      # tree-sitter. The runner image doesn't ship its packages, so their .deb
      # files are cached. The key holds every pin and the runner image, so a
      # cache never serves other versions. libtree-sitter-dev depends on
      # exactly its own version of libtree-sitter0, so TREE_SITTER_VERSION
      # pins both.
      - name: "Compute tree-sitter cache key"
        id: tree-sitter-key
        run: |
          key="tree-sitter-$RUNNER_OS-${ImageOS:?}-${ImageVersion:?}"
          key="$key-$TREE_SITTER_VERSION-$TREE_SITTER_C_VERSION"
          echo "key=$key" | tee -a "$GITHUB_OUTPUT"
      - name: "Restore tree-sitter packages"
        id: tree-sitter-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/tree-sitter-debs
          key: ${{ steps.tree-sitter-key.outputs.key }}

      # On a cache miss, apt fetches the package index and downloads exactly
      # the pinned versions or fails
      - name: "Download tree-sitter packages"
        if: ${{ steps.tree-sitter-cache.outputs.cache-hit != 'true' }}
        env:
          DEB_DIR: ${{ runner.temp }}/tree-sitter-debs
        run: |
          sudo apt-get update
          mkdir -p "$DEB_DIR"
          cd "$DEB_DIR"
          apt-get download "libtree-sitter0=$TREE_SITTER_VERSION" \
            "libtree-sitter-dev=$TREE_SITTER_VERSION" \
            "tree-sitter-c-src=$TREE_SITTER_C_VERSION"

      # Reads each package's version from its .deb file. Every package is
      # checked; the step fails if a file is missing or a version differs from
      # its pin.
      - name: "Verify tree-sitter versions"
        env:
          DEB_DIR: ${{ runner.temp }}/tree-sitter-debs
        run: |
          status=0
          verify() {
            actual=$(dpkg-deb -f "$DEB_DIR/$1"_*.deb Version || true)
            echo "$1 $actual"
            if [ "$actual" != "$2" ]; then
              echo "::error::$1 is '$actual', not the pinned $2"
              status=1
            fi
          }
          verify libtree-sitter0 "$TREE_SITTER_VERSION"
          verify libtree-sitter-dev "$TREE_SITTER_VERSION"
          verify tree-sitter-c-src "$TREE_SITTER_C_VERSION"
          exit "$status"

      # The packages are unpacked, not installed: dpkg -i reads the database of
      # every installed file, which takes up to 20 s on the runner. The
      # Makefile builds the checker against TREE_SITTER_ROOT, which later steps
      # get through GITHUB_ENV.
      - name: "Unpack tree-sitter"
        env:
          DEB_DIR: ${{ runner.temp }}/tree-sitter-debs
        run: |
          root="$RUNNER_TEMP/tree-sitter-root"
          for package in libtree-sitter0 libtree-sitter-dev tree-sitter-c-src; do
            dpkg-deb -x "$DEB_DIR/$package"_*.deb "$root"
          done
          echo "TREE_SITTER_ROOT=$root" >> "$GITHUB_ENV"

      # Saved only after the versions match their pins, and before the hooks
      # run, so a hook failure doesn't discard it
      - name: "Save tree-sitter packages"
        if: ${{ steps.tree-sitter-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/tree-sitter-debs
          key: ${{ steps.tree-sitter-key.outputs.key }}

      # One run of every hook except the report-only ones, so a failing hook
      # never hides another's findings. --verbose prints each hook's duration;
      # `time` adds the suite total.
      - name: "Run pre-commit"
        env:
          SKIP: ${{ env.REPORT_ONLY_HOOKS }}
        run: |
          set -o pipefail
          TIMEFORMAT='real %Rs'
          { time pre-commit run --all-files --hook-stage manual \
              --show-diff-on-failure --verbose; } 2>&1 \
            | tee "$RUNNER_TEMP/pre-commit.log"

      # The checker's golden fixtures, whatever the hooks found
      - name: "Test check-standards"
        if: ${{ !cancelled() }}
        run: time make checker-test

      # Given a hook id, pre-commit runs only that hook, so each report-only
      # hook gets its own call. Every one runs; the step fails if any did.
      - name: "Run report-only hooks"
        if: ${{ !cancelled() }}
        continue-on-error: true
        run: |
          set -o pipefail
          TIMEFORMAT='real %Rs'
          IFS=, read -ra hooks <<< "$REPORT_ONLY_HOOKS"
          { time (
              status=0
              for hook in "${hooks[@]}"; do
                pre-commit run "$hook" --all-files --hook-stage manual \
                  --show-diff-on-failure --verbose || status=1
              done
              exit "$status"
            ); } 2>&1 \
            | tee "$RUNNER_TEMP/report-only.log"

      - name: "Summarize timings"
        if: ${{ !cancelled() }}
        run: |
          # One table per step: summarize <heading> <log>
          summarize() {
            [ -f "$2" ] || return 0
            echo "### $1"
            echo
            echo "| Hook | Duration |"
            echo "| --- | --- |"
            awk '
              /\.\.\.(Passed|Failed)$/ {
                name = $0
                sub(/\.+(Passed|Failed)$/, "", name)
              }
              /^- duration: / { print "| " name " | " $3 " |" }
              /^real / { print "| **Total** | " $2 " |" }
            ' "$2"
            echo
          }
          {
            summarize "Blocking hooks" "$RUNNER_TEMP/pre-commit.log"
            summarize "Report-only hooks" "$RUNNER_TEMP/report-only.log"
          } >> "$GITHUB_STEP_SUMMARY"

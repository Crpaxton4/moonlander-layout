name: "Lint"

# A run on main fills the caches that all PRs can restore
on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # All hooks exclude these release-please files, so a PR that changes only them
  # skips the job. A `paths:` filter keeps the required check pending
  RELEASE_ONLY_PATHS: '^(CHANGELOG\.md|\.release-please-manifest\.json)$'

jobs:
  changes:
    if: github.event_name == 'pull_request'
    # Same Ubuntu release as the development machine
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    permissions:
      contents: read
      pull-requests: read
    outputs:
      release-only: ${{ steps.diff.outputs.release-only }}
    steps:
      # Job reads only the step scripts
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: .github/scripts
          persist-credentials: false
      - id: diff
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: .github/scripts/lint/detect-release-only-changes.sh

  lint:
    name: "Lint"
    needs: changes
    # A failed gate gives no output, so the job runs
    if: ${{ !cancelled() && (github.event_name != 'pull_request' || needs.changes.outputs.release-only != 'true') }}
    # Apt pins need the Ubuntu release of the development machine
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    # Dependabot updates each SHA pin and its release comment on the same line
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: "Load versions"
        run: .github/scripts/shared/load-versions.sh

      # Runner tool cache does not contain the NODE_VERSION release, so the job
      # caches that release for setup-node
      - name: "Compute node cache key"
        id: node-key
        run: .github/scripts/lint/compute-node-cache-key.sh
      - name: "Restore node runtime"
        id: node-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.node-key.outputs.path }}
          key: ${{ steps.node-key.outputs.key }}

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - run: .github/scripts/shared/install-npm-packages.sh

      - name: "Check node"
        env:
          NODE_DIR: ${{ steps.node-key.outputs.path }}
        run: .github/scripts/lint/check-node.sh

      # Save before the hooks, so a failed hook does not discard it
      - name: "Save node runtime"
        if: ${{ steps.node-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.node-key.outputs.path }}
          key: ${{ steps.node-key.outputs.key }}

      # uv downloads from PyPI faster than the Actions cache restores
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: false
      - name: "Check uv"
        run: .github/scripts/shared/check-uv-version.sh
      - name: "Install pre-commit"
        run: .github/scripts/lint/install-pre-commit.sh

      - name: "Compute pre-commit cache key"
        id: pre-commit-key
        env:
          CONFIG_HASH: ${{ hashFiles('.pre-commit-config.yaml') }}
        run: .github/scripts/lint/compute-pre-commit-cache-key.sh
      - name: "Restore pre-commit environments"
        id: pre-commit-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/pre-commit
          key: ${{ steps.pre-commit-key.outputs.key }}

      - name: "Install hook environments"
        run: .github/scripts/lint/install-hook-environments.sh

      # Save before the hooks, so a failed hook does not discard it
      - name: "Save pre-commit environments"
        if: ${{ steps.pre-commit-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/pre-commit
          key: ${{ steps.pre-commit-key.outputs.key }}

      # actionlint and the shellcheck hook run the shellcheck on PATH
      - name: "Compute shellcheck cache key"
        id: shellcheck-key
        run: .github/scripts/lint/compute-shellcheck-cache-key.sh
      - name: "Restore shellcheck package"
        id: shellcheck-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/shellcheck-deb
          key: ${{ steps.shellcheck-key.outputs.key }}

      - name: "Download shellcheck package"
        if: ${{ steps.shellcheck-cache.outputs.cache-hit != 'true' }}
        env:
          DEB_DIR: ${{ runner.temp }}/shellcheck-deb
        run: .github/scripts/lint/download-shellcheck-package.sh

      - name: "Unpack shellcheck"
        env:
          DEB_DIR: ${{ runner.temp }}/shellcheck-deb
        run: .github/scripts/lint/unpack-shellcheck.sh

      # Save before the hooks, so a failed hook does not discard it
      - name: "Save shellcheck package"
        if: ${{ steps.shellcheck-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/shellcheck-deb
          key: ${{ steps.shellcheck-key.outputs.key }}

      - name: "Check shellcheck"
        run: .github/scripts/lint/check-shellcheck.sh

      # Runner image does not contain the tree-sitter packages. The firmware job uses
      # the same cache key
      - name: "Compute tree-sitter cache key"
        id: tree-sitter-key
        run: .github/scripts/shared/compute-tree-sitter-cache-key.sh
      - name: "Restore tree-sitter packages"
        id: tree-sitter-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/tree-sitter-debs
          key: ${{ steps.tree-sitter-key.outputs.key }}

      - name: "Download tree-sitter packages"
        if: ${{ steps.tree-sitter-cache.outputs.cache-hit != 'true' }}
        env:
          DEB_DIR: ${{ runner.temp }}/tree-sitter-debs
        run: .github/scripts/shared/download-tree-sitter-packages.sh

      - name: "Verify tree-sitter versions"
        env:
          DEB_DIR: ${{ runner.temp }}/tree-sitter-debs
        run: .github/scripts/shared/verify-tree-sitter-versions.sh

      - name: "Unpack tree-sitter"
        env:
          DEB_DIR: ${{ runner.temp }}/tree-sitter-debs
        run: .github/scripts/shared/unpack-tree-sitter.sh

      # Save before the hooks, so a failed hook does not discard them
      - name: "Save tree-sitter packages"
        if: ${{ steps.tree-sitter-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/tree-sitter-debs
          key: ${{ steps.tree-sitter-key.outputs.key }}

      # check-standards hook builds the checker with CMake. cmocka comes with the
      # same script as in the firmware job
      - name: "Install CMake and cmocka"
        run: .github/scripts/shared/install-unit-test-tools.sh

      - name: "Run pre-commit"
        run: .github/scripts/lint/run-pre-commit.sh

      # Runs also after a failed hook
      - name: "Test check-standards"
        if: ${{ !cancelled() }}
        run: .github/scripts/lint/test-check-standards.sh

      - name: "Test key log converter"
        if: ${{ !cancelled() }}
        run: cmake --workflow --preset converter-test

      # Runner image does not contain MinGW-w64
      - name: "Install MinGW-w64"
        if: ${{ !cancelled() }}
        run: .github/scripts/lint/install-mingw.sh
      - name: "Build key log converter for Windows"
        if: ${{ !cancelled() }}
        run: cmake --workflow --preset windows

      - name: "Summarize timings"
        if: ${{ !cancelled() }}
        run: .github/scripts/lint/summarize-hook-timings.sh

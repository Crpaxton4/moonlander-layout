name: "Lint"

on:
  pull_request:
  workflow_dispatch:

env:
  # Must match PRE_COMMIT_VERSION in setup.sh
  PRE_COMMIT_VERSION: "4.7.0"
  # Must match SHELLCHECK_VERSION in setup.sh
  SHELLCHECK_VERSION: "0.9.0-1"
  # Must match TREE_SITTER_VERSION and TREE_SITTER_C_VERSION in setup.sh
  TREE_SITTER_VERSION: "0.20.8-2"
  TREE_SITTER_C_VERSION: "0.20.5-2"

jobs:
  lint:
    name: "Lint"
    # Same Ubuntu release as the development machine, so apt-pinned tools
    # (shellcheck) have identical versions
    runs-on: ubuntu-24.04
    # Report-only: findings don't fail the PR yet
    continue-on-error: true
    permissions:
      contents: read
    # Actions are pinned to commit SHAs; the trailing comment names the release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - run: npm ci

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - name: "Install pre-commit"
        run: uv tool install "pre-commit==$PRE_COMMIT_VERSION"

      # The runner image ships this version, so no `apt-get update` is needed.
      # apt installs exactly the pinned version or fails.
      - name: "Install shellcheck"
        run: |
          sudo apt-get install -y "shellcheck=$SHELLCHECK_VERSION"
          shellcheck --version

      # The check-standards hook builds against these. The runner image doesn't
      # ship them, so the package index is fetched first.
      - name: "Install tree-sitter"
        run: |
          sudo apt-get update
          sudo apt-get install -y "libtree-sitter-dev=$TREE_SITTER_VERSION" \
            "tree-sitter-c-src=$TREE_SITTER_C_VERSION"

      # One run of every hook, so a failing hook never hides another's findings.
      # --verbose prints each hook's duration; `time` adds the suite total.
      - name: "Run pre-commit"
        run: |
          set -o pipefail
          TIMEFORMAT='real %Rs'
          { time pre-commit run --all-files --hook-stage manual \
              --show-diff-on-failure --verbose; } 2>&1 \
            | tee "$RUNNER_TEMP/pre-commit.log"

      # The checker's golden fixtures, whatever the hooks found
      - name: "Test check-standards"
        if: ${{ !cancelled() }}
        run: time make -C tools/check_standards test

      - name: "Summarize timings"
        if: ${{ !cancelled() }}
        run: |
          [ -f "$RUNNER_TEMP/pre-commit.log" ] || exit 0
          {
            echo "| Hook | Duration |"
            echo "| --- | --- |"
            awk '
              /\.\.\.(Passed|Failed)$/ {
                name = $0
                sub(/\.+(Passed|Failed)$/, "", name)
              }
              /^- duration: / { print "| " name " | " $3 " |" }
              /^real / { print "| **Total** | " $2 " |" }
            ' "$RUNNER_TEMP/pre-commit.log"
          } >> "$GITHUB_STEP_SUMMARY"

name: "Lint"

on:
  pull_request:
  workflow_dispatch:

env:
  # Must match PRE_COMMIT_VERSION in setup.sh
  PRE_COMMIT_VERSION: "4.7.0"
  # Must match SHELLCHECK_VERSION in setup.sh
  SHELLCHECK_VERSION: "0.9.0-1"

jobs:
  lint:
    name: "Lint"
    runs-on: ubuntu-latest
    # Report-only: findings don't fail the PR yet
    continue-on-error: true
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
      - run: npm ci

      # setup-uv publishes no major tags, so it is pinned to a release
      - uses: astral-sh/setup-uv@v10.3.3
      - name: "Install pre-commit"
        run: uv tool install "pre-commit==$PRE_COMMIT_VERSION"

      # The runner image ships this version, so no `apt-get update` is needed.
      # apt installs exactly the pinned version or fails.
      - name: "Install shellcheck"
        run: |
          set -x
          command -v -a shellcheck || true
          shellcheck --version || true
          dpkg -S "$(command -v shellcheck)" || true
          dpkg -l | grep -i shellcheck || true
          ls -la /var/lib/apt/lists | head -20
          cat /etc/apt/sources.list.d/* 2>/dev/null | head -30
          time sudo apt-get update
          apt-cache policy shellcheck
          time sudo apt-get install -y "shellcheck=$SHELLCHECK_VERSION"
          command -v -a shellcheck
          shellcheck --version

      # One run of every hook, so a failing hook never hides another's findings.
      # --verbose prints each hook's duration; `time` adds the suite total.
      - name: "Run pre-commit"
        run: |
          set -o pipefail
          TIMEFORMAT='real %Rs'
          { time pre-commit run --all-files --hook-stage manual \
              --show-diff-on-failure --verbose; } 2>&1 \
            | tee "$RUNNER_TEMP/pre-commit.log"

      - name: "Summarize timings"
        if: ${{ !cancelled() }}
        run: |
          [ -f "$RUNNER_TEMP/pre-commit.log" ] || exit 0
          {
            echo "| Hook | Duration |"
            echo "| --- | --- |"
            awk '
              /\.\.\.(Passed|Failed)$/ {
                name = $0
                sub(/\.+(Passed|Failed)$/, "", name)
              }
              /^- duration: / { print "| " name " | " $3 " |" }
              /^real / { print "| **Total** | " $2 " |" }
            ' "$RUNNER_TEMP/pre-commit.log"
          } >> "$GITHUB_STEP_SUMMARY"

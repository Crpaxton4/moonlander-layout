name: "Build and analyze firmware"

on:
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      # The release build sets it: every change on main already passed the
      # analysis on its PR, and a failing check must not stop the release.
      skip-analysis:
        description: "Build the firmware only, without the static analysis"
        type: boolean
        default: false

# Files that feed the firmware build or the static analysis. PRs touching none
# of them skip the firmware job; a skipped job still satisfies its required
# check, which a `paths:` trigger filter would leave pending forever.
env:
  FIRMWARE_PATHS: '^src/|^Makefile$|(^|/)\.clang-tidy$|^Doxyfile$|^\.llvm-version$|^\.github/workflows/build\.yaml$'

jobs:
  changes:
    if: github.event_name == 'pull_request'
    # Pinned to the development machine's Ubuntu release so CI tools match local ones.
    runs-on: ubuntu-24.04
    outputs:
      firmware: ${{ steps.diff.outputs.firmware }}
    steps:
      - id: diff
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          files=$(gh pr diff ${{ github.event.pull_request.number }} --repo "$GITHUB_REPOSITORY" --name-only)
          echo "firmware=$(grep -qE "$FIRMWARE_PATHS" <<< "$files" && echo true || echo false)" >> "$GITHUB_OUTPUT"

  firmware:
    name: "Build and analyze firmware"
    needs: changes
    # Skips only when the gate says `false`: a failed gate has no output, so
    # the job runs.
    if: ${{ !cancelled() && (github.event_name != 'pull_request' || needs.changes.outputs.firmware != 'false') }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    env:
      # QMK's prebuilt toolchains (qmk/qmk_toolchains) and flashing tools
      # (qmk/qmk_flashutils), the releases in QMK's qmk_cli 1.2.0 image. The
      # build uses the ARM toolchain, and dfu-suffix from the flashing tools,
      # which appends the DFU suffix to the firmware. Each is pinned by release
      # and the sha256 of its Linux x64 asset, so the firmware toolchain
      # changes only on purpose: a new toolchain release changes the firmware
      # bytes. Bump each release and its sha256 together, by hand.
      QMK_TOOLCHAINS_RELEASE: "v15.2.0-1"
      QMK_TOOLCHAINS_SHA256: "6b136919e3526f3f373e91f7d011a006e968a3169262d33cf6efa3e6c605c3ca"
      QMK_FLASHUTILS_RELEASE: "20260318"
      QMK_FLASHUTILS_SHA256: "acb2f17ff5e6c555c657d0203fe647ea535fa98d214af8bf428015c7d0a20a15"
      # The QMK CLI from PyPI, the version in the same image. Bump it by hand.
      QMK_CLI_VERSION: "1.2.0"
      # uv resolves the QMK CLI's dependencies and qmk_firmware's unpinned
      # requirements as PyPI had them at this time, so every run installs the
      # same versions. Bump it by hand.
      QMK_PYTHON_DEPS_DATE: "2026-11-05T00:00:00Z"
      # The qmk_firmware submodules that the Moonlander build and the analysis
      # read, without their own submodules. The others are for other
      # platforms and for QMK's tests. `qmk compile` never fetches missing
      # submodules; a missing one that the build needs fails the build.
      QMK_SUBMODULES: "lib/chibios lib/chibios-contrib lib/lufa lib/printf modules/zsa"
    # Actions are pinned to commit SHAs; the trailing comment names the release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # src/.qmk-ref holds a pinned commit on ZSA's firmware25 branch, bumped
      # by hand. checkout takes a commit SHA as ref. The qmk_firmware checkout
      # is cached; the key holds the pinned commit and the submodule list, and
      # every run checks the checkout against the pin, so a cache never serves
      # another commit.
      - name: "Compute ZSA firmware cache key"
        id: qmk
        run: |
          ref=$(cat src/.qmk-ref)
          submodules_hash=$(sha256sum <<< "$QMK_SUBMODULES" | cut -c1-16)
          echo "ref=$ref" >> "$GITHUB_OUTPUT"
          echo "key=qmk-firmware-$RUNNER_OS-$ref-$submodules_hash" | tee -a "$GITHUB_OUTPUT"
      - name: "Restore ZSA firmware"
        id: qmk-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: qmk_firmware
          key: ${{ steps.qmk.outputs.key }}

      # No credentials stay in qmk_firmware/.git, which goes into the cache
      - name: "Check out ZSA firmware"
        if: ${{ steps.qmk-cache.outputs.cache-hit != 'true' }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: zsa/qmk_firmware
          ref: ${{ steps.qmk.outputs.ref }}
          path: qmk_firmware
          submodules: false
          persist-credentials: false

      - name: "Check out ZSA firmware submodules"
        if: ${{ steps.qmk-cache.outputs.cache-hit != 'true' }}
        working-directory: qmk_firmware
        run: |
          read -ra submodules <<< "$QMK_SUBMODULES"
          git submodule update --init --depth 1 --jobs "${#submodules[@]}" -- "${submodules[@]}"

      # qmk_firmware must be at the pinned commit, and each submodule in the
      # list at the commit that qmk_firmware records for it. `git submodule
      # status` starts such a line with a space.
      - name: "Verify ZSA firmware checkout"
        working-directory: qmk_firmware
        env:
          QMK_REF: ${{ steps.qmk.outputs.ref }}
        run: |
          set -o pipefail
          read -ra submodules <<< "$QMK_SUBMODULES"
          head=$(git rev-parse HEAD)
          echo "HEAD $head"
          if [ "$head" != "$QMK_REF" ]; then
            echo "::error::qmk_firmware is at $head, not at the pin $QMK_REF"
            exit 1
          fi
          git submodule status -- "${submodules[@]}" | tee "$RUNNER_TEMP/submodules.txt"
          status=0
          for path in "${submodules[@]}"; do
            recorded=$(git rev-parse "HEAD:$path")
            if ! grep -qE "^ $recorded $path( |$)" "$RUNNER_TEMP/submodules.txt"; then
              echo "::error::$path is not at $recorded"
              status=1
            fi
          done
          exit "$status"

      # Saved only after the checkout matches the pin, and before the build,
      # so no build output goes into the cache
      - name: "Save ZSA firmware"
        if: ${{ steps.qmk-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: qmk_firmware
          key: ${{ steps.qmk.outputs.key }}

      # The release assets are cached. The key holds both release pins and the
      # runner image; every run checks each asset against its sha256 pin, so a
      # cache never serves another release.
      - name: "Compute QMK toolchain cache key"
        id: toolchain-key
        run: |
          key="qmk-toolchain-$RUNNER_OS-${ImageOS:?}-${ImageVersion:?}"
          key="$key-$QMK_TOOLCHAINS_RELEASE-$QMK_FLASHUTILS_RELEASE"
          echo "key=$key" | tee -a "$GITHUB_OUTPUT"
      - name: "Restore QMK toolchain"
        id: toolchain-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/qmk-assets
          key: ${{ steps.toolchain-key.outputs.key }}

      # The toolchain asset is named after the GCC version: the release tag
      # without its leading `v` and its trailing build number
      - name: "Download QMK toolchain"
        if: ${{ steps.toolchain-cache.outputs.cache-hit != 'true' }}
        working-directory: ${{ runner.temp }}
        run: |
          gcc_version="${QMK_TOOLCHAINS_RELEASE#v}"
          gcc_version="${gcc_version%-*}"
          base="https://github.com/qmk"
          mkdir -p qmk-assets
          curl -fsSL -o qmk-assets/toolchains.tar.zst \
            "$base/qmk_toolchains/releases/download/$QMK_TOOLCHAINS_RELEASE/qmk_toolchains-gcc$gcc_version-host_linuxX64.tar.zst"
          curl -fsSL -o qmk-assets/flashutils.tar.zst \
            "$base/qmk_flashutils/releases/download/$QMK_FLASHUTILS_RELEASE/qmk_flashutils-$QMK_FLASHUTILS_RELEASE-linuxX64.tar.zst"

      # Unpacks the ARM toolchain, without the AVR and RISC-V ones, and
      # dfu-suffix into QMK_DISTRIB_DIR, as QMK's bootstrap lays them out. The
      # QMK CLI puts QMK_DISTRIB_DIR/bin first on PATH.
      - name: "Install QMK toolchain"
        working-directory: ${{ runner.temp }}
        run: |
          sha256sum -c - <<EOF
          $QMK_TOOLCHAINS_SHA256  qmk-assets/toolchains.tar.zst
          $QMK_FLASHUTILS_SHA256  qmk-assets/flashutils.tar.zst
          EOF
          dir="$RUNNER_TEMP/qmk-distrib"
          mkdir -p "$dir"
          tar --zstd -xf qmk-assets/toolchains.tar.zst -C "$dir" \
            --strip-components=1 --exclude=avr --exclude='avr-*' \
            --exclude='riscv32-unknown-elf*'
          tar --zstd -xf qmk-assets/flashutils.tar.zst -C "$dir/bin" ./dfu-suffix
          echo "QMK_DISTRIB_DIR=$dir" >> "$GITHUB_ENV"
          echo "$dir/bin" >> "$GITHUB_PATH"
          "$dir/bin/arm-none-eabi-gcc" --version
          "$dir/bin/dfu-suffix" --version

      # Saved only after the assets match their sha256 pins, and before the
      # build, so a build failure doesn't discard them
      - name: "Save QMK toolchain"
        if: ${{ steps.toolchain-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/qmk-assets
          key: ${{ steps.toolchain-key.outputs.key }}

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3

      # qmk_firmware's Python code runs in the QMK CLI's environment, so its
      # requirements go into the same tool environment
      - name: "Install QMK CLI"
        run: |
          uv tool install --exclude-newer "$QMK_PYTHON_DEPS_DATE" \
            --with-requirements qmk_firmware/requirements.txt \
            "qmk==$QMK_CLI_VERSION"
          qmk --version
          "$(uv tool dir)/qmk/bin/python" --version
      - run: >-
          qmk config user.qmk_home="$GITHUB_WORKSPACE/qmk_firmware"
          user.overlay_dir="$GITHUB_WORKSPACE/src"

      # One QMK build gives both the firmware in out/ and the compile database
      - name: "Build firmware and compile database"
        run: make compiledb

      # The steps from here on run even when an earlier one failed, so a
      # failing build still runs the analysis and a failing check still
      # uploads the firmware; the job fails at the end.
      - name: "Install clang-tidy"
        if: ${{ !cancelled() && !inputs.skip-analysis }}
        run: |
          uv tool install "clang-tidy==$(cat .llvm-version)"
          clang-tidy --version

      # The official release binary, as setup.sh installs it. It goes first on
      # PATH, so no other doxygen on the runner shadows it.
      - name: "Install Doxygen"
        if: ${{ !cancelled() && !inputs.skip-analysis }}
        env:
          # Must match DOXYGEN_VERSION and DOXYGEN_SHA256 in setup.sh
          DOXYGEN_VERSION: "1.18.0"
          DOXYGEN_SHA256: "14fa81bdc34171edb5f1f02b1d60e74802f0439b77fa44e592565d517d72df90"
        run: |
          tag="Release_$(echo "$DOXYGEN_VERSION" | tr . _)"
          curl -fsSL -o "$RUNNER_TEMP/doxygen.tar.gz" \
            "https://github.com/doxygen/doxygen/releases/download/$tag/doxygen-$DOXYGEN_VERSION.linux.bin.tar.gz"
          echo "$DOXYGEN_SHA256  $RUNNER_TEMP/doxygen.tar.gz" | sha256sum -c -
          mkdir -p "$HOME/.local/bin"
          tar -xzf "$RUNNER_TEMP/doxygen.tar.gz" -C "$HOME/.local/bin" \
            --strip-components=2 "doxygen-$DOXYGEN_VERSION/bin/doxygen"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.local/bin:$PATH"
          which -a doxygen
          doxygen --version

      # One run of every check, so a failing check never hides another's
      # findings. Each check prints a `timing` line, even when it fails. The
      # compile database is the one the build step wrote, so make doesn't
      # build it again.
      - name: "Run static analysis"
        if: ${{ !cancelled() && !inputs.skip-analysis }}
        run: |
          set -o pipefail
          make --assume-old=compiledb analyze 2>&1 | tee "$RUNNER_TEMP/analyze.log"

      - name: "Summarize timings"
        if: ${{ !cancelled() && !inputs.skip-analysis }}
        run: |
          [ -f "$RUNNER_TEMP/analyze.log" ] || exit 0
          {
            echo "| Check | Duration |"
            echo "| --- | --- |"
            awk '
              $1 == "timing" && $2 == "analyze-total" {
                print "| **Total** | " $3 " |"
                next
              }
              $1 == "timing" { print "| " $2 " | " $3 " |" }
            ' "$RUNNER_TEMP/analyze.log"
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: firmware
          path: out/

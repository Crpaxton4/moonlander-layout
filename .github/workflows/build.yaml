name: "Build and analyze firmware"

# A run on main fills the caches that all PRs can restore
on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:
  workflow_call:
    inputs:
      # Release builds set this input, because a failed check must not stop a
      # release
      skip-analysis:
        description: "Build the firmware only, without the static analysis"
        type: boolean
        default: false
      release-tag:
        description: "Release tag that the firmware file name ends in"
        type: string
        default: ""

# A called workflow that shares the group of its caller deadlocks, so the
# group starts with a fixed name
concurrency:
  group: build-${{ github.event_name }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# A skipped job satisfies its required check, but a `paths:` filter keeps the
# check pending. The Doxygen check also covers src/check_standards/ and
# src/key_log_converter/
env:
  FIRMWARE_PATHS: '^src/(qmk|ci|check_standards|key_log_converter)/|^test/|^Makefile$|^CMakeLists\.txt$|^CMakePresets\.json$|(^|/)\.clang-tidy$|^Doxyfile$|^versions\.env$|^\.github/workflows/build\.yaml$|^\.github/scripts/(build|shared)/'

jobs:
  changes:
    if: github.event_name == 'pull_request'
    # Same Ubuntu release as the development machine
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    outputs:
      firmware: ${{ steps.diff.outputs.firmware }}
    steps:
      # Job reads only the step scripts
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: .github/scripts
          persist-credentials: false
      - id: diff
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: .github/scripts/build/detect-firmware-changes.sh

  firmware:
    name: "Build and analyze firmware"
    needs: changes
    # A failed gate gives no output, so the job runs
    if: ${{ !cancelled() && (github.event_name != 'pull_request' || needs.changes.outputs.firmware != 'false') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      # These are the releases in the QMK qmk_cli 1.2.0 image. A new release changes
      # the firmware bytes, so change each release and its sha256 by hand
      QMK_TOOLCHAINS_RELEASE: "v15.2.0-1"
      QMK_TOOLCHAINS_SHA256: "6b136919e3526f3f373e91f7d011a006e968a3169262d33cf6efa3e6c605c3ca"
      QMK_FLASHUTILS_RELEASE: "20260318"
      QMK_FLASHUTILS_SHA256: "acb2f17ff5e6c555c657d0203fe647ea535fa98d214af8bf428015c7d0a20a15"
      # Same version as in that image
      QMK_CLI_VERSION: "1.2.0"
      # uv uses PyPI as it was at this time, so all runs install the same versions
      QMK_PYTHON_DEPS_DATE: "2026-11-05T00:00:00Z"
      # `qmk compile` never gets a missing submodule, so this list must contain all
      # submodules that the build needs
      QMK_SUBMODULES: "lib/chibios lib/chibios-contrib lib/lufa lib/printf modules/zsa"
      CCACHE_VERSION: "4.14.2"
      CCACHE_SHA256: "b20ff6415151226ac5a10dfd6839700c694bd67d1871c8fddb266d366ff25bfb"
    # Dependabot updates each SHA pin and its release comment on the same line
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: "Load versions"
        run: .github/scripts/shared/load-versions.sh

      # Each run compares the checkout with the pin, so a cache never gives a different
      # commit
      - name: "Compute ZSA firmware cache key"
        id: qmk
        run: .github/scripts/build/compute-zsa-firmware-cache-key.sh
      - name: "Restore ZSA firmware"
        id: qmk-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: qmk_firmware
          key: ${{ steps.qmk.outputs.key }}

      # qmk_firmware/.git goes into the cache, so it must contain no credentials
      - name: "Check out ZSA firmware"
        if: ${{ steps.qmk-cache.outputs.cache-hit != 'true' }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: zsa/qmk_firmware
          ref: ${{ steps.qmk.outputs.ref }}
          path: qmk_firmware
          submodules: false
          persist-credentials: false

      - name: "Check out ZSA firmware submodules"
        if: ${{ steps.qmk-cache.outputs.cache-hit != 'true' }}
        working-directory: qmk_firmware
        run: '"$GITHUB_WORKSPACE/.github/scripts/build/check-out-zsa-firmware-submodules.sh"'

      - name: "Verify ZSA firmware checkout"
        working-directory: qmk_firmware
        env:
          QMK_REF: ${{ steps.qmk.outputs.ref }}
        run: '"$GITHUB_WORKSPACE/.github/scripts/build/verify-zsa-firmware-checkout.sh"'

      # Save before the build, so no build output goes into the cache
      - name: "Save ZSA firmware"
        if: ${{ steps.qmk-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: qmk_firmware
          key: ${{ steps.qmk.outputs.key }}

      # Each run compares each asset with its sha256 pin, so a cache never gives a
      # different release
      - name: "Compute QMK toolchain and ccache cache keys"
        id: toolchain-key
        run: .github/scripts/build/compute-toolchain-cache-keys.sh
      - name: "Restore QMK toolchain"
        id: toolchain-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/qmk-assets
          key: ${{ steps.toolchain-key.outputs.key }}

      - name: "Download QMK toolchain"
        if: ${{ steps.toolchain-cache.outputs.cache-hit != 'true' }}
        working-directory: ${{ runner.temp }}
        run: '"$GITHUB_WORKSPACE/.github/scripts/build/download-qmk-toolchain.sh"'

      - name: "Install QMK toolchain"
        working-directory: ${{ runner.temp }}
        run: '"$GITHUB_WORKSPACE/.github/scripts/build/install-qmk-toolchain.sh"'

      # Save before the build, so a failed build does not discard the assets
      - name: "Save QMK toolchain"
        if: ${{ steps.toolchain-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/qmk-assets
          key: ${{ steps.toolchain-key.outputs.key }}

      # uv downloads from PyPI faster than the Actions cache restores
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: false
      - name: "Check uv"
        run: .github/scripts/shared/check-uv-version.sh

      - name: "Install QMK CLI"
        run: .github/scripts/build/install-qmk-cli.sh
      - run: .github/scripts/build/configure-qmk-cli.sh

      # A PR run uses ccache only if it restored an entry, so a missing cache costs
      # only the lookup. The release build never uses ccache
      - name: "Restore ccache"
        id: ccache-cache
        if: ${{ !inputs.skip-analysis }}
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/ccache
          key: ${{ steps.toolchain-key.outputs.ccache-prefix }}${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: ${{ steps.toolchain-key.outputs.ccache-prefix }}

      - name: "Install ccache"
        id: ccache
        if: ${{ !inputs.skip-analysis && (github.event_name == 'push' || steps.ccache-cache.outputs.cache-matched-key != '') }}
        run: .github/scripts/build/install-ccache.sh

      - name: "Install jq"
        run: .github/scripts/build/install-jq.sh

      - name: "Build firmware and compile databases"
        # PR values are empty outside a PR, and the tag is empty outside a release
        env:
          PR_NUMBER: ${{ github.event.pull_request.number || '' }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha || '' }}
          RELEASE_TAG: ${{ inputs.release-tag || '' }}
        run: .github/scripts/build/build-firmware.sh

      - name: "Prune ccache"
        id: ccache-prune
        if: ${{ !cancelled() && steps.ccache.outcome == 'success' }}
        run: .github/scripts/build/prune-ccache.sh
      # A PR run never saves, because its next push changes the same files again
      - name: "Save ccache"
        if: ${{ !cancelled() && github.event_name == 'push' && steps.ccache-prune.outputs.save == 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/ccache
          key: ${{ steps.toolchain-key.outputs.ccache-prefix }}${{ github.run_id }}-${{ github.run_attempt }}

      # Steps from here run also after a failed step, so a failed build still runs
      # the unit tests and the analysis
      - name: "Install unit test tools"
        if: ${{ !cancelled() && !inputs.skip-analysis }}
        run: .github/scripts/shared/install-unit-test-tools.sh

      - name: "Run unit tests"
        if: ${{ !cancelled() && !inputs.skip-analysis }}
        run: cmake --workflow --preset qmk-test

      - name: "Install clang-tidy"
        if: ${{ !cancelled() && !inputs.skip-analysis }}
        run: .github/scripts/shared/install-clang-tidy.sh

      - name: "Install Doxygen"
        if: ${{ !cancelled() && !inputs.skip-analysis }}
        run: .github/scripts/build/install-doxygen.sh

      - name: "Run static analysis"
        if: ${{ !cancelled() && !inputs.skip-analysis }}
        run: .github/scripts/build/run-static-analysis.sh

      - name: "Summarize timings"
        if: ${{ !cancelled() && !inputs.skip-analysis }}
        run: .github/scripts/build/summarize-analysis-timings.sh

      # upload-artifact skips the dot directory .build/ without include-hidden-files
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: firmware
          path: .build/*.bin
          include-hidden-files: true

name: "Build and analyze firmware"

# A run on main fills the main-scope caches, which all PRs can restore. A run on
# main always runs the full job, for all changes, and checks main itself.
on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:
  workflow_call:
    inputs:
      # The release build sets this input. All changes on main passed the
      # analysis on their PR, and a failed check must not stop the release.
      skip-analysis:
        description: "Build the firmware only, without the static analysis"
        type: boolean
        default: false

# A new push to a PR cancels the older run of that PR. All other runs have their
# own group, so GitHub never cancels or holds a run on main or a release build.
# In a workflow_call, github.workflow and github.run_id come from the caller.
# Thus the group starts with a fixed name, because a called workflow that shares
# the group of its caller deadlocks.
concurrency:
  group: build-${{ github.event_name }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# The files that the firmware build or the static analysis use. A PR that changes
# none of them skips the firmware job. A skipped job still satisfies its required
# check. With a `paths:` trigger filter, the required check stays pending.
env:
  FIRMWARE_PATHS: '^src/qmk/|^Makefile$|(^|/)\.clang-tidy$|^Doxyfile$|^\.llvm-version$|^\.github/workflows/build\.yaml$'
  # The uv release that setup-uv installs. It must be the same as UV_VERSION in
  # lint.yaml.
  UV_VERSION: "0.13.7"

jobs:
  changes:
    if: github.event_name == 'pull_request'
    # The Ubuntu release of the development machine, so that the CI tools are the
    # same as the local tools.
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    outputs:
      firmware: ${{ steps.diff.outputs.firmware }}
    steps:
      - id: diff
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          files=$(gh pr diff ${{ github.event.pull_request.number }} --repo "$GITHUB_REPOSITORY" --name-only)
          echo "firmware=$(grep -qE "$FIRMWARE_PATHS" <<< "$files" && echo true || echo false)" >> "$GITHUB_OUTPUT"

  firmware:
    name: "Build and analyze firmware"
    needs: changes
    # The job skips only if the gate gives `false`. A failed gate has no output,
    # so the job runs.
    if: ${{ !cancelled() && (github.event_name != 'pull_request' || needs.changes.outputs.firmware != 'false') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      # The prebuilt toolchains (qmk/qmk_toolchains) and flash tools
      # (qmk/qmk_flashutils) of QMK, at the releases in the QMK qmk_cli 1.2.0
      # image. The build uses the ARM toolchain and dfu-suffix, which adds the DFU
      # suffix to the firmware. Each pin is a release and the sha256 of its Linux
      # x64 asset. A new toolchain release changes the firmware bytes, so only a
      # manual pin change can change the toolchain. Change each release and its
      # sha256 together, by hand.
      QMK_TOOLCHAINS_RELEASE: "v15.2.0-1"
      QMK_TOOLCHAINS_SHA256: "6b136919e3526f3f373e91f7d011a006e968a3169262d33cf6efa3e6c605c3ca"
      QMK_FLASHUTILS_RELEASE: "20260318"
      QMK_FLASHUTILS_SHA256: "acb2f17ff5e6c555c657d0203fe647ea535fa98d214af8bf428015c7d0a20a15"
      # The QMK CLI from PyPI, at the version in the same image. Change it by
      # hand.
      QMK_CLI_VERSION: "1.2.0"
      # uv resolves the dependencies of the QMK CLI and the unpinned requirements
      # of qmk_firmware as PyPI had them at this time. Thus all runs install the
      # same versions. Change it by hand.
      QMK_PYTHON_DEPS_DATE: "2026-11-05T00:00:00Z"
      # The qmk_firmware submodules that the Moonlander build and the analysis
      # read, without their own submodules. The other submodules are for other
      # platforms and for the QMK tests. `qmk compile` never gets a missing
      # submodule, so the build fails if it needs a missing one.
      QMK_SUBMODULES: "lib/chibios lib/chibios-contrib lib/lufa lib/printf modules/zsa"
      # The static Linux x64 release of ccache (ccache/ccache). The pin is the
      # release and the sha256 of its asset. Change both together, by hand.
      CCACHE_VERSION: "4.14.2"
      CCACHE_SHA256: "b20ff6415151226ac5a10dfd6839700c694bd67d1871c8fddb266d366ff25bfb"
    # Each action has a pin to a commit SHA. The comment at the end of the line
    # gives the release. Dependabot updates the SHA and that comment together, so
    # the comment stays on the same line.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # src/qmk/.qmk-ref contains a pinned commit on the firmware25 branch of ZSA.
      # Change it by hand. checkout accepts a commit SHA as ref. The cache key of
      # the qmk_firmware checkout contains the pinned commit and the submodule
      # list. Each run compares the checkout with the pin, so a cache never gives
      # a different commit.
      - name: "Compute ZSA firmware cache key"
        id: qmk
        run: |
          ref=$(cat src/qmk/.qmk-ref)
          submodules_hash=$(sha256sum <<< "$QMK_SUBMODULES" | cut -c1-16)
          echo "ref=$ref" >> "$GITHUB_OUTPUT"
          echo "key=qmk-firmware-$RUNNER_OS-$ref-$submodules_hash" | tee -a "$GITHUB_OUTPUT"
      - name: "Restore ZSA firmware"
        id: qmk-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: qmk_firmware
          key: ${{ steps.qmk.outputs.key }}

      # qmk_firmware/.git goes into the cache, so no credentials stay in it.
      - name: "Check out ZSA firmware"
        if: ${{ steps.qmk-cache.outputs.cache-hit != 'true' }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: zsa/qmk_firmware
          ref: ${{ steps.qmk.outputs.ref }}
          path: qmk_firmware
          submodules: false
          persist-credentials: false

      - name: "Check out ZSA firmware submodules"
        if: ${{ steps.qmk-cache.outputs.cache-hit != 'true' }}
        working-directory: qmk_firmware
        run: |
          read -ra submodules <<< "$QMK_SUBMODULES"
          git submodule update --init --depth 1 --jobs "${#submodules[@]}" -- "${submodules[@]}"

      # qmk_firmware must be at the pinned commit. Each submodule in the list must
      # be at the commit that qmk_firmware records for it. `git submodule status`
      # starts the line of such a submodule with a space.
      - name: "Verify ZSA firmware checkout"
        working-directory: qmk_firmware
        env:
          QMK_REF: ${{ steps.qmk.outputs.ref }}
        run: |
          set -o pipefail
          read -ra submodules <<< "$QMK_SUBMODULES"
          head=$(git rev-parse HEAD)
          echo "HEAD $head"
          if [ "$head" != "$QMK_REF" ]; then
            echo "::error::qmk_firmware is at $head, not at the pin $QMK_REF"
            exit 1
          fi
          git submodule status -- "${submodules[@]}" | tee "$RUNNER_TEMP/submodules.txt"
          status=0
          for path in "${submodules[@]}"; do
            recorded=$(git rev-parse "HEAD:$path")
            if ! grep -qE "^ $recorded $path( |$)" "$RUNNER_TEMP/submodules.txt"; then
              echo "::error::$path is not at $recorded"
              status=1
            fi
          done
          exit "$status"

      # This step saves the checkout after the pin check and before the build, so
      # no build output goes into the cache.
      - name: "Save ZSA firmware"
        if: ${{ steps.qmk-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: qmk_firmware
          key: ${{ steps.qmk.outputs.key }}

      # The cache key of the release assets contains the two release pins and the
      # runner image. Each run compares each asset with its sha256 pin, so a cache
      # never gives a different release. This step also gives the prefix of the
      # ccache cache keys. The prefix contains the runner OS, the toolchain release
      # and the ccache release, but not the image version. No file of the image
      # goes into a compiled object, and ccache itself hashes the compiler binary
      # and all input files.
      - name: "Compute QMK toolchain and ccache cache keys"
        id: toolchain-key
        run: |
          key="qmk-toolchain-$RUNNER_OS-${ImageOS:?}-${ImageVersion:?}"
          key="$key-$QMK_TOOLCHAINS_RELEASE-$QMK_FLASHUTILS_RELEASE"
          echo "key=$key" | tee -a "$GITHUB_OUTPUT"
          prefix="ccache-$RUNNER_OS-$ImageOS-$QMK_TOOLCHAINS_RELEASE-$CCACHE_VERSION-"
          echo "ccache-prefix=$prefix" | tee -a "$GITHUB_OUTPUT"
      - name: "Restore QMK toolchain"
        id: toolchain-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/qmk-assets
          key: ${{ steps.toolchain-key.outputs.key }}

      # The name of the toolchain asset contains the GCC version. That version is
      # the release tag without its first `v` and its last build number.
      - name: "Download QMK toolchain"
        if: ${{ steps.toolchain-cache.outputs.cache-hit != 'true' }}
        working-directory: ${{ runner.temp }}
        run: |
          gcc_version="${QMK_TOOLCHAINS_RELEASE#v}"
          gcc_version="${gcc_version%-*}"
          base="https://github.com/qmk"
          mkdir -p qmk-assets
          curl -fsSL -o qmk-assets/toolchains.tar.zst \
            "$base/qmk_toolchains/releases/download/$QMK_TOOLCHAINS_RELEASE/qmk_toolchains-gcc$gcc_version-host_linuxX64.tar.zst"
          curl -fsSL -o qmk-assets/flashutils.tar.zst \
            "$base/qmk_flashutils/releases/download/$QMK_FLASHUTILS_RELEASE/qmk_flashutils-$QMK_FLASHUTILS_RELEASE-linuxX64.tar.zst"

      # This step extracts the ARM toolchain (not the AVR and RISC-V toolchains)
      # and dfu-suffix into QMK_DISTRIB_DIR, with the layout of the QMK bootstrap.
      # The QMK CLI puts QMK_DISTRIB_DIR/bin first on PATH.
      - name: "Install QMK toolchain"
        working-directory: ${{ runner.temp }}
        run: |
          sha256sum -c - <<EOF
          $QMK_TOOLCHAINS_SHA256  qmk-assets/toolchains.tar.zst
          $QMK_FLASHUTILS_SHA256  qmk-assets/flashutils.tar.zst
          EOF
          dir="$RUNNER_TEMP/qmk-distrib"
          mkdir -p "$dir"
          tar --zstd -xf qmk-assets/toolchains.tar.zst -C "$dir" \
            --strip-components=1 --exclude=avr --exclude='avr-*' \
            --exclude='riscv32-unknown-elf*'
          tar --zstd -xf qmk-assets/flashutils.tar.zst -C "$dir/bin" ./dfu-suffix
          echo "QMK_DISTRIB_DIR=$dir" >> "$GITHUB_ENV"
          echo "$dir/bin" >> "$GITHUB_PATH"
          "$dir/bin/arm-none-eabi-gcc" --version
          "$dir/bin/dfu-suffix" --version

      # This step saves the assets after the sha256 check and before the build,
      # so a failed build does not discard them.
      - name: "Save QMK toolchain"
        if: ${{ steps.toolchain-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/qmk-assets
          key: ${{ steps.toolchain-key.outputs.key }}

      # uv downloads the QMK CLI and clang-tidy from PyPI faster than the Actions
      # cache restores them. Thus the uv cache is off.
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: false
      - name: "Check uv"
        run: |
          actual=$(uv --version || true)
          echo "$actual"
          read -r _ version _ <<< "$actual"
          if [ "$version" != "$UV_VERSION" ]; then
            echo "::error::uv is '$version', not the pinned $UV_VERSION"
            exit 1
          fi

      # The Python code of qmk_firmware runs in the environment of the QMK CLI.
      # Thus its requirements go into the same tool environment.
      - name: "Install QMK CLI"
        run: |
          uv tool install --exclude-newer "$QMK_PYTHON_DEPS_DATE" \
            --with-requirements qmk_firmware/requirements.txt \
            "qmk==$QMK_CLI_VERSION"
          qmk --version
          "$(uv tool dir)/qmk/bin/python" --version
      - run: >-
          qmk config user.qmk_home="$GITHUB_WORKSPACE/qmk_firmware"
          user.overlay_dir="$GITHUB_WORKSPACE/src/qmk"

      # ccache keeps the compiled objects between runs, so a build compiles only
      # the files whose inputs changed. A cache entry contains the pinned ccache
      # release asset and the objects of one build. A run restores the newest
      # entry with the prefix. A run on main always compiles through ccache and
      # saves the entries, which all PRs can restore. A PR run only reads them. It
      # compiles through ccache only if it restored an entry. Without an entry, it
      # uses the plain compiler, so a missing cache costs only the lookup. The
      # release build never uses ccache, so its firmware never comes from a cache
      # entry. ccache hashes the compiler binary and all sources and headers, so
      # an entry never gives an object from different inputs. The paths are the
      # same in all runs, so the job sets no base directory.
      - name: "Restore ccache"
        id: ccache-cache
        if: ${{ !inputs.skip-analysis }}
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/ccache
          key: ${{ steps.toolchain-key.outputs.ccache-prefix }}${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: ${{ steps.toolchain-key.outputs.ccache-prefix }}

      # ccache runs as the compiler. QMK finds arm-none-eabi-gcc on PATH, and
      # QMK_PATH_PREFIX puts a link with that name to ccache first. The compile
      # database records the link, and clang-tidy reads it as the compiler. The
      # USE_CCACHE option of QMK records `ccache` as the compiler, so the job does
      # not use that option. ccache runs the real compiler from CCACHE_PATH.
      # Depend mode gets the headers from the dependency file of the compiler
      # (QMK compiles with -MMD), so a cache miss runs no extra preprocessor pass.
      # The asset comes from the restored entry, or else from the release. The
      # stamp file marks the start of the build.
      - name: "Install ccache"
        id: ccache
        if: ${{ !inputs.skip-analysis && (github.event_name == 'push' || steps.ccache-cache.outputs.cache-matched-key != '') }}
        run: |
          dir="$RUNNER_TEMP/ccache"
          name="ccache-$CCACHE_VERSION-linux-x86_64-musl-static"
          mkdir -p "$dir"
          if [ ! -f "$dir/$name.tar.xz" ]; then
            curl -fsSL -o "$dir/$name.tar.xz" \
              "https://github.com/ccache/ccache/releases/download/v$CCACHE_VERSION/$name.tar.xz"
          fi
          echo "$CCACHE_SHA256  $dir/$name.tar.xz" | sha256sum -c -
          bin="$RUNNER_TEMP/ccache-bin"
          mkdir -p "$bin"
          tar -xJf "$dir/$name.tar.xz" -C "$bin" --strip-components=1 "$name/ccache"
          ln -s ccache "$bin/arm-none-eabi-gcc"
          version=$("$bin/ccache" --print-version)
          echo "ccache $version"
          if [ "$version" != "$CCACHE_VERSION" ]; then
            echo "::error::ccache is '$version', not the pinned $CCACHE_VERSION"
            exit 1
          fi
          {
            echo "QMK_PATH_PREFIX=$bin"
            echo "CCACHE_PATH=$QMK_DISTRIB_DIR/bin"
            echo "CCACHE_DIR=$dir/objects"
            # ccache hashes the compiler binary, not its mtime.
            echo "CCACHE_COMPILERCHECK=content"
            echo "CCACHE_DEPEND=true"
            # The objects of one build use approximately 2 MB.
            echo "CCACHE_MAXSIZE=50M"
          } >> "$GITHUB_ENV"
          CCACHE_DIR="$dir/objects" "$bin/ccache" --zero-stats
          touch "$RUNNER_TEMP/ccache-build-start"

      - name: "Build firmware and compile database"
        run: make compiledb

      # This step prints the hits and misses of the build. Then it removes each
      # cache file that the build did not use, so an entry contains the objects of
      # one build. Only a run on main that stored new objects saves the cache.
      # Otherwise, the restored entry already contains the same files. A PR run
      # never saves. Its new objects are mostly from the changed files, which the
      # next push changes again. A save takes more time than a new compile.
      - name: "Prune ccache"
        id: ccache-prune
        if: ${{ !cancelled() && steps.ccache.outcome == 'success' }}
        run: |
          ccache="$QMK_PATH_PREFIX/ccache"
          "$ccache" --show-stats --verbose
          writes=$("$ccache" --print-stats | awk '$1 == "local_storage_write" { print $2 }')
          start=$(stat -c %Y "$RUNNER_TEMP/ccache-build-start")
          "$ccache" --evict-older-than "$(( $(date +%s) - start + 1 ))s"
          du -sh "$RUNNER_TEMP/ccache"
          echo "save=$([ "${writes:-0}" -gt 0 ] && echo true || echo false)" | tee -a "$GITHUB_OUTPUT"
      - name: "Save ccache"
        if: ${{ !cancelled() && github.event_name == 'push' && steps.ccache-prune.outputs.save == 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/ccache
          key: ${{ steps.toolchain-key.outputs.ccache-prefix }}${{ github.run_id }}-${{ github.run_attempt }}

      # The steps from here run also if an earlier step failed. Thus a failed
      # build still runs the analysis, and a failed check still uploads the
      # firmware. The job fails at the end.
      - name: "Install clang-tidy"
        if: ${{ !cancelled() && !inputs.skip-analysis }}
        run: |
          uv tool install "clang-tidy==$(cat .llvm-version)"
          clang-tidy --version

      # The official release binary, as setup.sh installs it. It goes first on
      # PATH, so no other doxygen on the runner hides it.
      - name: "Install Doxygen"
        if: ${{ !cancelled() && !inputs.skip-analysis }}
        env:
          # These must be the same as DOXYGEN_VERSION and DOXYGEN_SHA256 in
          # setup.sh.
          DOXYGEN_VERSION: "1.18.0"
          DOXYGEN_SHA256: "14fa81bdc34171edb5f1f02b1d60e74802f0439b77fa44e592565d517d72df90"
        run: |
          tag="Release_$(echo "$DOXYGEN_VERSION" | tr . _)"
          curl -fsSL -o "$RUNNER_TEMP/doxygen.tar.gz" \
            "https://github.com/doxygen/doxygen/releases/download/$tag/doxygen-$DOXYGEN_VERSION.linux.bin.tar.gz"
          echo "$DOXYGEN_SHA256  $RUNNER_TEMP/doxygen.tar.gz" | sha256sum -c -
          mkdir -p "$HOME/.local/bin"
          tar -xzf "$RUNNER_TEMP/doxygen.tar.gz" -C "$HOME/.local/bin" \
            --strip-components=2 "doxygen-$DOXYGEN_VERSION/bin/doxygen"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.local/bin:$PATH"
          which -a doxygen
          doxygen --version

      # One run of all checks, so a failed check never hides the findings of a
      # different check. Each check prints a `timing` line, also if it fails. The
      # compile database is the one from the build step, so make does not build
      # it again.
      - name: "Run static analysis"
        if: ${{ !cancelled() && !inputs.skip-analysis }}
        run: |
          set -o pipefail
          make --assume-old=compiledb analyze 2>&1 | tee "$RUNNER_TEMP/analyze.log"

      - name: "Summarize timings"
        if: ${{ !cancelled() && !inputs.skip-analysis }}
        run: |
          [ -f "$RUNNER_TEMP/analyze.log" ] || exit 0
          {
            echo "| Check | Duration |"
            echo "| --- | --- |"
            awk '
              $1 == "timing" && $2 == "analyze-total" {
                print "| **Total** | " $3 " |"
                next
              }
              $1 == "timing" { print "| " $2 " | " $3 " |" }
            ' "$RUNNER_TEMP/analyze.log"
          } >> "$GITHUB_STEP_SUMMARY"

      # Only the firmware. upload-artifact stores the files relative to .build/,
      # so the release step finds the .bin at the root of the artifact. .build/
      # is a dot directory, and upload-artifact skips it if include-hidden-files
      # is off.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: firmware
          path: .build/*.bin
          include-hidden-files: true

name: "Build firmware"

on:
  pull_request:
  workflow_call:

# Files that feed the firmware build. PRs touching none of them skip the build
# job; a skipped job still satisfies the required "Build firmware" check, which
# a `paths:` trigger filter would leave pending forever.
env:
  BUILD_PATHS: '^(src/|Makefile$|\.github/workflows/build\.yaml$)'

jobs:
  changes:
    if: github.event_name == 'pull_request'
    # Pinned to the development machine's Ubuntu release so CI tools match local ones.
    runs-on: ubuntu-24.04
    outputs:
      build: ${{ steps.diff.outputs.build }}
    steps:
      - id: diff
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          files=$(gh pr diff ${{ github.event.pull_request.number }} --repo "$GITHUB_REPOSITORY" --name-only)
          echo "build=$(grep -qE "$BUILD_PATHS" <<< "$files" && echo true || echo false)" >> "$GITHUB_OUTPUT"

  build:
    name: "Build firmware"
    needs: changes
    if: ${{ !cancelled() && (github.event_name != 'pull_request' || needs.changes.outputs.build == 'true') }}
    runs-on: ubuntu-24.04
    # Pinned by digest so the firmware toolchain changes only on purpose. Dependabot
    # can't update it: bump the tag and digest of a new qmk_cli release together.
    container: ghcr.io/qmk/qmk_cli:1.2.0@sha256:b7d7fa8fb4432b569931de5ad59098cb788f440ed61a62c5126746b71aee0f4a
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # src/.qmk-ref holds a pinned commit on ZSA's firmware25 branch, bumped
      # by hand. checkout takes a commit SHA as ref.
      - name: "Read ZSA firmware commit"
        id: ref
        run: echo "ref=$(cat src/.qmk-ref)" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: zsa/qmk_firmware
          ref: ${{ steps.ref.outputs.ref }}
          path: qmk_firmware
          submodules: recursive

      - run: pip install -r qmk_firmware/requirements.txt
      - run: qmk config user.qmk_home="$GITHUB_WORKSPACE/qmk_firmware" user.overlay_dir="$GITHUB_WORKSPACE/src"
      - run: make

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: firmware
          path: out/

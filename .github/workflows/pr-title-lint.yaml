name: "Lint PR Title"

# A squash merge makes the PR title into the commit message that release-please
# reads
on:
  pull_request:
    types:
      - opened
      - edited
      - synchronize

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Dependabot makes titles that are too long for commitlint, and its settings cannot
  # change the title text. A title change with the job token starts no new run, so
  # the lint job checks the title that this job gives
  shorten-dependabot-title:
    name: "Shorten Dependabot title"
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write
    outputs:
      title: ${{ steps.shorten.outputs.title }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: .github/scripts
          persist-credentials: false
      - id: shorten
        env:
          TITLE: ${{ github.event.pull_request.title }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          GH_TOKEN: ${{ github.token }}
        run: .github/scripts/pr-title-lint/shorten-dependabot-title.sh

  lint-pr-title:
    name: "Validate PR title"
    needs: shorten-dependabot-title
    # Runs also when the Dependabot job skips, for all other PRs
    if: ${{ !cancelled() }}
    # Same Ubuntu release as the development machine
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: "Load versions"
        run: .github/scripts/shared/load-versions.sh
      # Lint job of the CI workflow restores the same node runtime
      - uses: ./.github/actions/node
      - env:
          TITLE: >-
            ${{ needs.shorten-dependabot-title.outputs.title
            || github.event.pull_request.title }}
        run: .github/scripts/pr-title-lint/lint-pr-title.sh

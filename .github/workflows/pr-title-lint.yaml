name: "Lint PR Title"

# Squash-merge uses the PR title as the commit on main, which release-please
# reads. The title is checked with the same commitlint config as local commits.
on:
  pull_request:
    types:
      - opened
      - edited
      - synchronize

jobs:
  lint-pr-title:
    name: "Validate PR title"
    # Pinned to the development machine's Ubuntu release so CI tools match local ones.
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - run: npm ci
      - env:
          TITLE: ${{ github.event.pull_request.title }}
        run: echo "$TITLE" | npx --no -- commitlint

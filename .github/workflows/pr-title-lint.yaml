name: "Lint PR Title"

# A squash merge makes the PR title into the commit message on main, and
# release-please reads that message. commitlint checks the title with the same
# configuration as local commits.
on:
  pull_request:
    types:
      - opened
      - edited
      - synchronize

# A new push or edit cancels the older run of the PR.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-pr-title:
    name: "Validate PR title"
    # The Ubuntu release of the development machine, so that the CI tools are the
    # same as the local tools.
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - run: npm ci
      - env:
          TITLE: ${{ github.event.pull_request.title }}
        run: echo "$TITLE" | npx --no -- commitlint

name: "Lint PR Title"

# Squash-merge uses the PR title as the commit on main, which release-please
# reads. The title is checked with the same commitlint config as local commits.
on:
  pull_request:
    types:
      - opened
      - edited
      - synchronize

jobs:
  lint-pr-title:
    name: "Validate PR title"
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
      - run: npm ci
      - env:
          TITLE: ${{ github.event.pull_request.title }}
        run: echo "$TITLE" | npx --no -- commitlint

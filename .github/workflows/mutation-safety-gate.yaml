name: "Mutation safety gate"

# Gate mutates only the lines that differ from the diff ref. On a PR, the ref is the
# base branch, so a PR with no change of the code under test has no mutants and
# passes. A run on main mutates the last merge and fills the caches that all PRs can
# restore
on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      diff-ref:
        description: "Git ref of the diff; empty mutates the changes of the last commit"
        type: string
        default: ""

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # A skipped job passes its check, but a `paths:` filter keeps the check pending.
  # The gate needs the code under test, the tests, and the CMake and CI files of the
  # mutation build
  MUTATION_PATHS: '^src/qmk/(keyboards/|\.qmk-ref$)|^src/(check_standards|key_log_converter|ci)/|^test/|^CMakeLists\.txt$|^CMakePresets\.json$|^versions\.env$|^\.github/workflows/mutation-safety-gate\.yaml$|^\.github/scripts/(mutation|shared)/'

jobs:
  changes:
    if: github.event_name == 'pull_request'
    # Same Ubuntu release as the development machine
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    permissions:
      contents: read
      pull-requests: read
    outputs:
      changed: ${{ steps.diff.outputs.changed }}
    steps:
      # Job reads only the step scripts
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: .github/scripts
          persist-credentials: false
      - id: diff
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          CHANGE_PATHS: ${{ env.MUTATION_PATHS }}
        run: .github/scripts/shared/detect-changes.sh

  mutation:
    name: "Mutation safety gate"
    needs: changes
    # A failed change check gives no output, so the job runs
    if: ${{ !cancelled() && (github.event_name != 'pull_request' || needs.changes.outputs.changed != 'false') }}
    # Apt pins need the Ubuntu release of the development machine
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      # Unit tests compile against the QMK headers of this checkout
      QMK_HOME: ${{ github.workspace }}/qmk_firmware
    # Dependabot updates each SHA pin and its release comment on the same line
    steps:
      # Mull compares the checkout with the diff ref, so the checkout needs that
      # commit. A PR checkout is a merge commit, and its first parent is the base
      # branch. A diff ref of a manual run can be any commit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: ${{ inputs.diff-ref && '0' || '2' }}
          persist-credentials: false
      - name: "Load versions"
        run: .github/scripts/shared/load-versions.sh
      - name: "Use all cores"
        run: .github/scripts/shared/use-all-cores.sh

      # Unit tests read the QMK headers and the LED map of the Moonlander keyboard data,
      # so the checkout has no submodules
      - name: "Read ZSA firmware pin"
        id: qmk
        run: .github/scripts/shared/read-qmk-ref.sh
      - name: "Check out ZSA firmware headers"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: zsa/qmk_firmware
          ref: ${{ steps.qmk.outputs.ref }}
          path: qmk_firmware
          submodules: false
          sparse-checkout: |
            keyboards/zsa/moonlander
            platforms
            quantum
            tmk_core
          persist-credentials: false

      # Checker part needs tree-sitter. The other jobs use the same cache key
      - name: "Compute tree-sitter cache key"
        id: tree-sitter-key
        run: .github/scripts/shared/compute-tree-sitter-cache-key.sh
      - name: "Restore tree-sitter packages"
        id: tree-sitter-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/tree-sitter-debs
          key: ${{ steps.tree-sitter-key.outputs.key }}

      - name: "Download tree-sitter packages"
        if: ${{ steps.tree-sitter-cache.outputs.cache-hit != 'true' }}
        env:
          DEB_DIR: ${{ runner.temp }}/tree-sitter-debs
        run: .github/scripts/shared/download-tree-sitter-packages.sh

      - name: "Verify tree-sitter versions"
        env:
          DEB_DIR: ${{ runner.temp }}/tree-sitter-debs
        run: .github/scripts/shared/verify-tree-sitter-versions.sh

      - name: "Unpack tree-sitter"
        env:
          DEB_DIR: ${{ runner.temp }}/tree-sitter-debs
        run: .github/scripts/shared/unpack-tree-sitter.sh

      # Save before the gate, so a failed gate does not discard them
      - name: "Save tree-sitter packages"
        if: ${{ steps.tree-sitter-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/tree-sitter-debs
          key: ${{ steps.tree-sitter-key.outputs.key }}

      # Each job that uses CMake restores the same packages. A cache hit needs no
      # package lists and no download
      - name: "Compute CMake and cmocka cache key"
        id: unit-test-apt-key
        env:
          APT_PACKAGES: cmake=${{ env.CMAKE_VERSION }} libcmocka-dev=${{ env.CMOCKA_VERSION }}
        run: .github/scripts/shared/compute-apt-cache-key.sh
      - name: "Restore CMake and cmocka packages"
        id: unit-test-apt-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/unit-test-debs
          key: ${{ steps.unit-test-apt-key.outputs.key }}

      - name: "Download CMake and cmocka packages"
        if: ${{ steps.unit-test-apt-cache.outputs.cache-hit != 'true' }}
        env:
          APT_PACKAGES: cmake=${{ env.CMAKE_VERSION }} libcmocka-dev=${{ env.CMOCKA_VERSION }}
          DEB_DIR: ${{ runner.temp }}/unit-test-debs
        run: .github/scripts/shared/download-apt-packages.sh

      - name: "Verify CMake and cmocka packages"
        env:
          APT_PACKAGES: cmake=${{ env.CMAKE_VERSION }} libcmocka-dev=${{ env.CMOCKA_VERSION }}
          DEB_DIR: ${{ runner.temp }}/unit-test-debs
        run: .github/scripts/shared/verify-apt-packages.sh

      # Save before the install, so a failed install does not discard them
      - name: "Save CMake and cmocka packages"
        if: ${{ steps.unit-test-apt-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/unit-test-debs
          key: ${{ steps.unit-test-apt-key.outputs.key }}

      - name: "Install CMake and cmocka"
        env:
          APT_PACKAGES: cmake=${{ env.CMAKE_VERSION }} libcmocka-dev=${{ env.CMOCKA_VERSION }}
          DEB_DIR: ${{ runner.temp }}/unit-test-debs
        run: .github/scripts/shared/install-apt-packages.sh
      - name: "Use pinned CMake"
        run: .github/scripts/shared/use-pinned-cmake.sh

      # Runner image contains the pinned clang packages, so a cache miss downloads no
      # package
      - name: "Compute clang cache key"
        id: clang-apt-key
        env:
          APT_PACKAGES: clang-18=${{ env.CLANG_VERSION }} libclang-rt-18-dev=${{ env.CLANG_VERSION }}
        run: .github/scripts/shared/compute-apt-cache-key.sh
      - name: "Restore clang packages"
        id: clang-apt-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/clang-debs
          key: ${{ steps.clang-apt-key.outputs.key }}

      - name: "Download clang packages"
        if: ${{ steps.clang-apt-cache.outputs.cache-hit != 'true' }}
        env:
          APT_PACKAGES: clang-18=${{ env.CLANG_VERSION }} libclang-rt-18-dev=${{ env.CLANG_VERSION }}
          DEB_DIR: ${{ runner.temp }}/clang-debs
        run: .github/scripts/shared/download-apt-packages.sh

      - name: "Verify clang packages"
        env:
          APT_PACKAGES: clang-18=${{ env.CLANG_VERSION }} libclang-rt-18-dev=${{ env.CLANG_VERSION }}
          DEB_DIR: ${{ runner.temp }}/clang-debs
        run: .github/scripts/shared/verify-apt-packages.sh

      # Save before the install, so a failed install does not discard them
      - name: "Save clang packages"
        if: ${{ steps.clang-apt-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/clang-debs
          key: ${{ steps.clang-apt-key.outputs.key }}

      - name: "Install clang"
        env:
          APT_PACKAGES: clang-18=${{ env.CLANG_VERSION }} libclang-rt-18-dev=${{ env.CLANG_VERSION }}
          DEB_DIR: ${{ runner.temp }}/clang-debs
        run: .github/scripts/shared/install-apt-packages.sh

      # Mull packages come from the GitHub release, not from an apt archive. Each
      # run compares each package with its sha256 pin, so a cache never gives a
      # different package
      - name: "Compute Mull cache key"
        id: mull-key
        run: .github/scripts/mutation/compute-mull-cache-key.sh
      - name: "Restore Mull packages"
        id: mull-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/mull-debs
          key: ${{ steps.mull-key.outputs.key }}

      - name: "Download Mull packages"
        if: ${{ steps.mull-cache.outputs.cache-hit != 'true' }}
        env:
          DEB_DIR: ${{ runner.temp }}/mull-debs
        run: .github/scripts/mutation/download-mull-packages.sh

      - name: "Verify Mull packages"
        env:
          DEB_DIR: ${{ runner.temp }}/mull-debs
        run: .github/scripts/mutation/verify-mull-packages.sh

      # Save before the gate, so a failed gate does not discard them
      - name: "Save Mull packages"
        if: ${{ steps.mull-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/mull-debs
          key: ${{ steps.mull-key.outputs.key }}

      - name: "Install Mull"
        env:
          DEB_DIR: ${{ runner.temp }}/mull-debs
        run: .github/scripts/mutation/install-mutation-tools.sh

      # Mull plugin release is in the key, so a new plugin never restores objects with
      # the mutants of the old plugin. A PR run uses ccache only if it restored an
      # entry, so a missing cache costs only the lookup
      - name: "Compute ccache cache key"
        id: ccache-key
        env:
          CCACHE_NAME: mutation
          COMPILER: clang-18
          FLAGS_HASH: ${{ hashFiles('CMakeLists.txt', 'CMakePresets.json', 'src/ci/mull.yml') }}
          KEY_EXTRA: mull-${{ env.MULL_VERSION }}-${{ env.MULL_PLUGIN_SHA256 }}
        run: .github/scripts/shared/compute-ccache-key.sh
      - name: "Restore ccache"
        id: ccache-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/ccache
          key: ${{ steps.ccache-key.outputs.key }}
          restore-keys: |
            ${{ steps.ccache-key.outputs.prefix }}
            ${{ steps.ccache-key.outputs.compiler-prefix }}

      - name: "Install ccache"
        id: ccache
        if: ${{ github.event_name != 'pull_request' || steps.ccache-cache.outputs.cache-matched-key != '' }}
        run: .github/scripts/shared/install-ccache.sh

      # On a PR, a push and a manual run without a ref, the diff ref is the first
      # parent of the checkout
      - name: "Run mutation gate"
        env:
          MUTATION_DIFF_REF: ${{ inputs.diff-ref || 'HEAD^1' }}
        run: .github/scripts/mutation/run-mutation-gate.sh

      - name: "Prune ccache"
        id: ccache-prune
        if: ${{ !cancelled() && steps.ccache.outcome == 'success' }}
        run: .github/scripts/shared/prune-ccache.sh
      # A PR run never saves, because its next push changes the same files again
      - name: "Save ccache"
        if: ${{ !cancelled() && github.event_name != 'pull_request' && steps.ccache-prune.outputs.save == 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/ccache
          key: ${{ steps.ccache-key.outputs.key }}

      - name: "Summarize surviving mutants"
        if: ${{ !cancelled() }}
        env:
          REPORT_DIR: .build/mutation-diff/report
          MULL_CONFIG: .build/mutation-diff/mull.yml
        run: .github/scripts/mutation/summarize-mutants.sh

      # upload-artifact skips the dot directory .build/ without include-hidden-files
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: mutation-report
          path: .build/mutation-diff/report/
          include-hidden-files: true
          if-no-files-found: ignore

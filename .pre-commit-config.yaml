# All hooks run and report, also after a hook fails. The run fails at the end if
# a hook failed.
fail_fast: false
default_install_hook_types: [pre-commit, commit-msg]
# The hooks that examine code run at commit time (pre-commit stage) and in CI. CI
# runs the manual stage (lint.yaml).

repos:
  - repo: local
    hooks:
      # The PR title check uses the same configuration. A squash merge makes the
      # PR title into the commit message on main.
      - id: commitlint
        name: commitlint
        entry: npx --no -- commitlint --edit
        language: system
        stages: [commit-msg]

  # The hook skips the files that release-please, npm or a third party writes.
  # These files keep the format that their owner gives them.
  - repo: https://github.com/editorconfig-checker/editorconfig-checker.python
    rev: 3.11.1
    hooks:
      - id: editorconfig-checker
        name: editorconfig-checker
        stages: [pre-commit, manual]
        exclude: |
          (?x)(
            ^CHANGELOG\.md$|
            ^\.release-please-manifest\.json$|
            ^package-lock\.json$|
            ^LICENSE$
          )

  # The rev must agree with .llvm-version, which pins clang-tidy to the same LLVM
  # release.
  - repo: https://github.com/pre-commit/mirrors-clang-format
    rev: v23.1.3
    hooks:
      - id: clang-format
        name: clang-format
        stages: [pre-commit, manual]
        # .c and .h files, and the .inc keymap grid fragments, which are C.
        types_or: [c, inc]
        # The hook reports violations and does not change files. The upstream
        # entry is `clang-format -i`, so this hook replaces the entry and the args.
        entry: clang-format
        args: [--dry-run, -Werror]

  # Prettier reads .editorconfig. .prettierignore skips the files that tools
  # write. require_serial gives one run for the hook, so the findings end in one
  # summary line.
  - repo: local
    hooks:
      - id: prettier
        name: prettier
        entry: npx --no -- prettier --check
        language: system
        types_or: [json, markdown, yaml]
        require_serial: true
        stages: [pre-commit, manual]

  # If Go is not installed, pre-commit downloads a Go toolchain to build
  # actionlint.
  - repo: https://github.com/rhysd/actionlint
    rev: v1.7.12
    hooks:
      - id: actionlint
        name: actionlint
        stages: [pre-commit, manual]

  # The shellcheck of apt. setup.sh and lint.yaml pin its version. actionlint
  # uses the same binary for the run: blocks of workflows.
  - repo: local
    hooks:
      - id: shellcheck
        name: shellcheck
        entry: shellcheck
        language: system
        types: [shell]
        stages: [pre-commit, manual]

  # The C checker of this repository. It builds against the apt tree-sitter
  # packages that setup.sh and lint.yaml pin. In CI, it runs only in Lint, because
  # the Static analysis container has a different tree-sitter.
  # require_serial gives one build and one summary line. The fixtures contain
  # violations of the rules, so the hook excludes them.
  - repo: local
    hooks:
      - id: check-standards
        name: check-standards
        entry: src/check_standards/run.sh
        language: system
        types_or: [c, inc]
        exclude: ^test/check_standards/
        require_serial: true
        stages: [pre-commit, manual]

  # shfmt reads its style from .editorconfig. -d prints a diff and does not change
  # files.
  - repo: https://github.com/scop/pre-commit-shfmt
    rev: v3.14.1-1
    hooks:
      - id: shfmt
        name: shfmt
        args: [-d]
        stages: [pre-commit, manual]

# Every hook runs and reports, even after an earlier one fails; the run fails
# at the end if any hook did.
fail_fast: false
default_install_hook_types: [pre-commit, commit-msg]
# Code-judging hooks run at commit time (pre-commit stage) and in CI, which
# runs the manual stage (lint.yaml).

repos:
  - repo: local
    hooks:
      # Same config as the PR title check, which squash-merge turns into the
      # commit on main
      - id: commitlint
        name: commitlint
        entry: npx --no -- commitlint --edit
        language: system
        stages: [commit-msg]

  # Files owned by release-please, npm or a third party are left in the form
  # their owner writes them.
  - repo: https://github.com/editorconfig-checker/editorconfig-checker.python
    rev: 3.11.1
    hooks:
      - id: editorconfig-checker
        name: editorconfig-checker
        stages: [pre-commit, manual]
        exclude: |
          (?x)(
            \.md$|
            ^\.release-please-manifest\.json$|
            ^package-lock\.json$|
            ^LICENSE$
          )
      # Markdown is checked separately so its findings can be gated on their
      # own. Manual stage only: CI reports them without failing the job
      # (REPORT_ONLY_HOOKS in lint.yaml).
      - id: editorconfig-checker
        alias: editorconfig-checker-markdown
        name: editorconfig-checker-markdown
        stages: [manual]
        files: \.md$
        exclude: ^CHANGELOG\.md$

  # The rev must match .llvm-version, which pins clang-tidy to the same LLVM
  # release.
  - repo: https://github.com/pre-commit/mirrors-clang-format
    rev: v22.1.8
    hooks:
      - id: clang-format
        name: clang-format
        stages: [pre-commit, manual]
        # .c and .h, plus .inc keymap grid fragments, which are C
        types_or: [c, inc]
        # Reports violations without rewriting files. The upstream entry is
        # `clang-format -i`, so the entry is replaced as well as the args.
        entry: clang-format
        args: [--dry-run, -Werror]

  # Prettier reads .editorconfig; .prettierignore skips the files tools write.
  # require_serial gives one run per hook, so the findings end in a single
  # summary line.
  - repo: local
    hooks:
      - id: prettier
        name: prettier
        entry: npx --no -- prettier --check
        language: system
        types_or: [json, yaml]
        require_serial: true
        stages: [pre-commit, manual]
      # Markdown is checked separately so its findings can be gated on their
      # own. Manual stage only: CI reports them without failing the job
      # (REPORT_ONLY_HOOKS in lint.yaml).
      - id: prettier-markdown
        name: prettier-markdown
        entry: npx --no -- prettier --check
        language: system
        types_or: [markdown]
        require_serial: true
        stages: [manual]

  # pre-commit builds actionlint with a Go toolchain it downloads itself when Go
  # is not installed.
  - repo: https://github.com/rhysd/actionlint
    rev: v1.7.12
    hooks:
      - id: actionlint
        name: actionlint
        stages: [pre-commit, manual]

  # apt's shellcheck, pinned in setup.sh and lint.yaml. actionlint lints
  # workflow run: blocks with the same binary.
  - repo: local
    hooks:
      - id: shellcheck
        name: shellcheck
        entry: shellcheck
        language: system
        types: [shell]
        stages: [pre-commit, manual]

  # The repository's own C checker, built against the apt tree-sitter packages
  # pinned in setup.sh and lint.yaml; in CI it runs only in Lint, as the Static
  # analysis container ships a different tree-sitter.
  # require_serial: one build and one summary line. The fixtures break its rules
  # on purpose.
  - repo: local
    hooks:
      - id: check-standards
        name: check-standards
        entry: tools/check_standards/run.sh
        language: system
        types_or: [c, inc]
        exclude: ^tools/check_standards/fixtures/
        require_serial: true
        stages: [pre-commit, manual]

  # Style comes from .editorconfig. -d prints a diff instead of rewriting.
  - repo: https://github.com/scop/pre-commit-shfmt
    rev: v3.14.1-1
    hooks:
      - id: shfmt
        name: shfmt
        args: [-d]
        stages: [pre-commit, manual]

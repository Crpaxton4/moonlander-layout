# Every hook runs and reports, even after an earlier one fails; the run fails
# at the end if any hook did.
fail_fast: false
default_install_hook_types: [pre-commit, commit-msg]

repos:
  - repo: local
    hooks:
      # Same config as the PR title check, which squash-merge turns into the
      # commit on main
      - id: commitlint
        name: commitlint
        entry: npx --no -- commitlint --edit
        language: system
        stages: [commit-msg]

  # Report-only (manual stage). Files owned by release-please, npm or a third
  # party are left in the form their owner writes them.
  - repo: https://github.com/editorconfig-checker/editorconfig-checker.python
    rev: 3.11.1
    hooks:
      - id: editorconfig-checker
        name: editorconfig-checker
        stages: [manual]
        exclude: |
          (?x)(
            \.md$|
            ^\.release-please-manifest\.json$|
            ^package-lock\.json$|
            ^LICENSE$
          )
      # Markdown is checked separately so its findings can be gated on their own
      - id: editorconfig-checker
        alias: editorconfig-checker-markdown
        name: editorconfig-checker-markdown
        stages: [manual]
        files: \.md$
        exclude: ^CHANGELOG\.md$

  # Report-only (manual stage). The rev's major must match .llvm-version.
  - repo: https://github.com/pre-commit/mirrors-clang-format
    rev: v22.1.8
    hooks:
      - id: clang-format
        name: clang-format
        stages: [manual]
        # .c and .h, plus .inc keymap grid fragments, which are C
        types_or: [c, inc]
        # Reports violations without rewriting files. The upstream entry is
        # `clang-format -i`, so the entry is replaced as well as the args.
        entry: clang-format
        args: [--dry-run, -Werror]
        
  # Report-only (manual stage). Prettier reads .editorconfig; .prettierignore
  # skips the files tools write. require_serial gives one run per hook, so the
  # findings end in a single summary line.
  - repo: local
    hooks:
      - id: prettier
        name: prettier
        entry: npx --no -- prettier --check
        language: system
        types_or: [json, yaml]
        require_serial: true
        stages: [manual]
      # Markdown is checked separately so its findings can be gated on their own
      - id: prettier-markdown
        name: prettier-markdown
        entry: npx --no -- prettier --check
        language: system
        types_or: [markdown]
        require_serial: true
        stages: [manual]
        
  # Report-only (manual stage). pre-commit builds actionlint with a Go toolchain
  # it downloads itself when Go is not installed.
  - repo: https://github.com/rhysd/actionlint
    rev: v1.7.12
    hooks:
      - id: actionlint
        name: actionlint
        stages: [manual]
        
  # apt's shellcheck, pinned in setup.sh and lint.yaml. actionlint lints
  # workflow run: blocks with the same binary.
  - repo: local
    hooks:
      - id: shellcheck
        name: shellcheck
        entry: shellcheck
        language: system
        types: [shell]
        stages: [manual]

  # Style comes from .editorconfig. -d prints a diff instead of rewriting.
  - repo: https://github.com/scop/pre-commit-shfmt
    rev: v3.14.1-1
    hooks:
      - id: shfmt
        name: shfmt
        args: [-d]
        stages: [manual]

fail_fast: false
default_install_hook_types: [pre-commit, commit-msg]
# CI runs the manual stage (lint.yaml), so each check hook has both stages.

repos:
  - repo: local
    hooks:
      - id: commitlint
        name: commitlint
        entry: npx --no -- commitlint --edit
        language: system
        stages: [commit-msg]

  # The owners of these files (release-please, npm and a third party) set their
  # format.
  - repo: https://github.com/editorconfig-checker/editorconfig-checker.python
    rev: 3.11.1
    hooks:
      - id: editorconfig-checker
        name: editorconfig-checker
        stages: [pre-commit, manual]
        exclude: |
          (?x)(
            ^CHANGELOG\.md$|
            ^\.release-please-manifest\.json$|
            ^package-lock\.json$|
            ^LICENSE$
          )

  # The rev must agree with .llvm-version.
  - repo: https://github.com/pre-commit/mirrors-clang-format
    rev: v23.1.3
    hooks:
      - id: clang-format
        name: clang-format
        stages: [pre-commit, manual]
        # The .inc keymap grid fragments are C.
        types_or: [c, inc]
        # The upstream entry `clang-format -i` changes files, so this hook
        # replaces it.
        entry: clang-format
        args: [--dry-run, -Werror]

  # require_serial gives one run, so the findings end in one summary line.
  - repo: local
    hooks:
      - id: prettier
        name: prettier
        entry: npx --no -- prettier --check
        language: system
        types_or: [json, markdown, yaml]
        require_serial: true
        stages: [pre-commit, manual]

  - repo: https://github.com/rhysd/actionlint
    rev: v1.7.12
    hooks:
      - id: actionlint
        name: actionlint
        stages: [pre-commit, manual]

  # setup.sh and lint.yaml pin this apt shellcheck. actionlint uses the same binary.
  - repo: local
    hooks:
      - id: shellcheck
        name: shellcheck
        entry: shellcheck
        language: system
        types: [shell]
        stages: [pre-commit, manual]

  # require_serial gives one build and one summary line. The fixtures break the
  # rules on purpose.
  - repo: local
    hooks:
      - id: check-standards
        name: check-standards
        entry: src/check_standards/run.sh
        language: system
        types_or: [c, inc]
        exclude: ^test/check_standards/
        require_serial: true
        stages: [pre-commit, manual]

  - repo: https://github.com/scop/pre-commit-shfmt
    rev: v3.14.1-1
    hooks:
      - id: shfmt
        name: shfmt
        args: [-d]
        stages: [pre-commit, manual]
